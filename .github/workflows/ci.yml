name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Skip if project not scaffolded yet
        id: guard
        run: |
          if [ -f pubspec.yaml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - run: flutter pub get
        if: steps.guard.outputs.ok == 'true'
      - name: Analyze
        if: steps.guard.outputs.ok == 'true'
        run: flutter analyze 2>&1 | tee analyze.log; exit ${PIPESTATUS[0]}
      - name: Test
        if: always() && steps.guard.outputs.ok == 'true'
        run: flutter test --reporter expanded 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      # Fehlerausgabe als Commit-Kommentar, damit sie über die API lesbar ist
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### CI failed'; echo '```'; tail -c 30000 analyze.log 2>/dev/null; echo; echo '--- test ---'; grep -vE ': loading ' test.log 2>/dev/null | tail -c 30000; echo '```'; } > report.md
          jq -Rs '{body: .}' report.md > body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d @body.json > /dev/null

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: challenges-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # Auf main: APK als Release „latest“ veröffentlichen (direkter Download am Handy)
      - name: Release latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk challenges.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest challenges.apk --target "$GITHUB_SHA" \
            --title "Challenges (neueste Version)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Zum Installieren challenges.apk am Handy herunterladen und öffnen."
