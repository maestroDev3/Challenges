name: Screenshots

# Rendert echte App-Screenshots (Golden-Rendering) und legt sie auf dem
# Branch `screenshots` ab. Manuell auslösbar.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fonts installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-roboto-unhinted fonts-noto-color-emoji
          echo "ROBOTO_DIR=$(dirname "$(fc-list | grep -m1 'Roboto-Regular.ttf' | cut -d: -f1)")" >> "$GITHUB_ENV"
          echo "EMOJI_FONT=$(fc-list | grep -m1 'NotoColorEmoji' | cut -d: -f1)" >> "$GITHUB_ENV"
          echo "ICON_FONT=$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Rendern
        run: flutter test screenshots --update-goldens 2>&1 | tee shots.log; exit ${PIPESTATUS[0]}
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### Screenshots failed'; echo '```'; grep -vE ': loading ' shots.log | tail -c 30000; echo '```'; } > report.md
          jq -Rs '{body: .}' report.md > body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d @body.json > /dev/null
      - name: Auf Branch screenshots ablegen
        run: |
          mkdir /tmp/shots && cp screenshots/out/*.png /tmp/shots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots-tmp
          git rm -rq --cached . && git clean -fdq -e .git
          cp /tmp/shots/*.png .
          git add *.png
          git commit -qm "Screenshots von ${GITHUB_SHA::7}"
          git push -f origin screenshots-tmp:screenshots
