name: Smoke

# Startet die Release-APK auf einem echten Android-Emulator (frisch und als
# Update über die Vorversion). Fängt Abstürze, die Unit-/Widget-Tests nicht sehen.
on:
  push:
    branches: [main, 'epic/**', 'smoke/**']
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Vorversion (Commit/Tag) für den Update-Test'
        default: 'ac61edf7c46492d52510e7b1eab42cd2116e6b31'

permissions:
  contents: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE: ${{ inputs.baseline || 'ac61edf7c46492d52510e7b1eab42cd2116e6b31' }}

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/android/sdk/ndk /usr/share/swift /usr/local/share/powershell
          docker image prune -af > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE }}
          path: baseline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: APK bauen (neu)
        run: flutter pub get && flutter build apk --release
      - name: APK bauen (Vorversion)
        working-directory: baseline
        run: flutter pub get && flutter build apk --release
      - name: APKs sichern, Build-Reste löschen
        run: |
          mkdir -p apks
          cp build/app/outputs/flutter-apk/app-release.apk apks/new.apk
          cp baseline/build/app/outputs/flutter-apk/app-release.apk apks/old.apk
          rm -rf build baseline/build ~/.gradle/caches
          df -h /
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Starttest auf Emulator
        run: |
          set -o pipefail
          bash scripts/emulator.sh 2>&1 | tee emu.log
      - name: Logs hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            smoke.log
            emu.log
            logcat_*.txt
      - name: Ergebnis als Commit-Kommentar
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "### Smoke (Emulator): ${{ job.status }}"; echo '```'; tail -c 20000 smoke.log 2>/dev/null || echo 'kein smoke.log'; echo '--- emulator ---'; grep -v '^\[=*' emu.log 2>/dev/null | tail -c 10000; echo '```'; } > report.md
          jq -Rs '{body: .}' report.md > body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -d @body.json > /dev/null
